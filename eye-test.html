<!DOCTYPE html>

<head>

    <style>
        html {
            background-color: black;
        }
        .eye {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 50px;
            height: 0px;
            background-color: white;
            border-color: black;
            border-width: 1px;
            border-style: solid;
            overflow: hidden;
            border-radius: 50%;
            animation-name: eyelid;
            animation-duration: 15s;
            animation-timing-function: cubic-bezier();
            animation-iteration-count: infinite;
        }
        
        .pupil {
            position: relative;
            background-color: black;
            width: 30px;
            height: 30px;
            top: calc(50% - 15px);
            left: calc(50% - 15px);
            border-radius: 50%;
            /* animation: slide-in 5s infinite; */
            animation-name: slide-in;
            animation-duration: 15s;
            animation-iteration-count: infinite;
        }

        @keyframes slide-in {
            5%, 7% {
                top: calc(50% - 15px);
                left: calc(50% - 15px);
            }
            9%, 13% {
                top: calc(50% - 15px);
                left: calc(25% - 15px);
            }
            17%, 21% {
                top: calc(50% - 15px);
                left: calc(75% - 15px);
                width: 30px;
                height: 30px;
            }
            25%, 35% {
                top: calc(50% - 20px);
                left: calc(50% - 20px);
                width: 40px;
                height: 40px;
            }  
            100% {
                top: calc(50% - 15px);
                left: calc(50% - 15px);
                width: 30px;
                height: 30px;
            }        
        }

        @keyframes eyelid {
            0%, 5% {
                height: 0px;
            }

            6% {
                height: 50px; 
                transform: translateY(-50%);
            }
            
            45% {
                height: 50px;
                transform: translateY(-50%);
            }
            46%, 100% {
                height: 0px;
            }
        }
    </style>
</head>

<body>
    <div class="eye">
        <div class="pupil"></div>
    </body>
</div>
